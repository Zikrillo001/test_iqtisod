<title>Tarmoqlar iqtisodiyoti — Test</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mu:#6b7280;--bd:#dde1e7;--ac:#2563eb;--ok:#15803d;--okb:#dcfce7;--er:#b91c1c;--erb:#fee2e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14171c;--card:#1d2128;--tx:#e8eaed;--mu:#9aa3af;--bd:#333a45;--ac:#60a5fa;--ok:#4ade80;--okb:#12301d;--er:#f87171;--erb:#3a1717}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14171c;--card:#1d2128;--tx:#e8eaed;--mu:#9aa3af;--bd:#333a45;--ac:#60a5fa;--ok:#4ade80;--okb:#12301d;--er:#f87171;--erb:#3a1717}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.timer{font-weight:700;font-variant-numeric:tabular-nums;font-size:20px}
.timer.low{color:var(--er)}
.prog{font-size:14px;color:var(--mu)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
.q h3{margin:0 0 10px;font-size:16px;font-weight:600}
.o{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;margin:7px 0;cursor:pointer}
.o:hover{border-color:var(--ac)}
.o.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.o.ok{border-color:var(--ok);background:var(--okb)}
.o.bad{border-color:var(--er);background:var(--erb)}
.o b{min-width:20px;color:var(--mu)}
.r{text-align:center;padding:24px 0}
.big{font-size:44px;font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.nav a{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--bd);border-radius:8px;font-size:13px;text-decoration:none;color:var(--tx);background:var(--card)}
.nav a.d{background:var(--ac);color:#fff;border-color:var(--ac)}
</style></head><body><div class="w" id="app"></div>
<script>
const ALL=[["Tarmoqlar iqtisodiyoti fanining predmeti nimadan iborat?","Tarmoqlarning faoliyati va rivojlanish qonuniyatlarini o‘rganish","Valyuta kurslari o‘zgarishining sabablarini o‘rganish va bashorat qilish","Byudjet daromadlarini shakllantirish va soliq stavkalarini asoslash","Aholi daromadlarining taqsimlanishi va ijtimoiy himoyasini o‘rganish"],["Tarmoqlar iqtisodiyoti fani qaysi fanlar bilan o‘zaro bog‘liq o‘rganiladi?","Iqtisodiy siyosat va institutsional iqtisodiyot fanlari bilan","Organik kimyo va umumiy fizika kabi tabiiy fanlar bilan","Tilshunoslik va adabiyotshunoslik kabi gumanitar fanlar bilan","Jarrohlik va farmakologiya kabi klinik-tibbiy fanlar bilan"],["Tarmoqlar iqtisodiyoti fanining uslubiga qaysi yondashuv xos?","Tizimli yondashuv, statistik tahlil va ko‘rsatkichlarni taqqoslash","Ko‘rsatkichlarsiz, faqat sub’ektiv fikrga tayanib xulosa chiqarish","Laboratoriyada kimyoviy reaksiyalarni kuzatish va o‘lchash usuli","Arxiv hujjatlarini mazmunini o‘zgartirmay nusxalab takrorlash"],["Milliy iqtisodiyot tarmoqlari asosan qaysi ikki sohaga bo‘linadi?","Moddiy ishlab chiqarish va nomoddiy (xizmat) sohalarga","Ichki bozorga va tashqi bozorga yo‘naltirilgan ishlab chiqarishga","Davlat mulkiga asoslangan va aralash mulkli tarmoqlarga","Yirik korxonalar tarmog‘i va mayda korxonalar tarmog‘iga"],["Birlamchi sektorga qaysi tarmoqlar kiradi?","Qishloq xo‘jaligi, o‘rmon xo‘jaligi, baliqchilik va qazib olish","Mashinasozlik, kimyo sanoati va qurilish materiallari ishlab chiqarish","Savdo, transport, aloqa va moliyaviy xizmatlar ko‘rsatish tarmoqlari","Ta’lim, sog‘liqni saqlash va davlat boshqaruvi sohalari tarmoqlari"],["Ikkilamchi sektorga qaysi tarmoqlar kiradi?","Qayta ishlovchi sanoat, energetika va qurilish tarmoqlari","Dehqonchilik, chorvachilik, baliqchilik va o‘rmon xo‘jaligi","Savdo, turizm, ta’lim va sog‘liqni saqlash xizmatlari","Bank, sug‘urta, konsalting va axborot xizmatlari sohasi"],["Uchlamchi sektor (xizmatlar sohasi) tarkibiga qaysi tarmoqlar kiradi?","Savdo, transport, aloqa, moliya va sog‘liqni saqlash","Metallurgiya, mashinasozlik, kimyo va qurilish materiallari","Dehqonchilik, bog‘dorchilik, chorvachilik va qazib olish","Elektr energetika, neft qazib olish va tog‘-kon sanoati"],["Iqtisodiyot tarmoqlarining tarkibiy tuzilishi nimani ifodalaydi?","Tarmoqlarning o‘zaro nisbati va mahsulotdagi ulushini","Korxonalarning yer maydoni bo‘yicha hududiy joylashuvini","Aholining yosh va jins bo‘yicha taqsimlanish tarkibini","Byudjet xarajatlarining yo‘nalishlar bo‘yicha taqsimotini"],["«Industrial structure» (sanoat tuzilmasi) tushunchasi nimani anglatadi?","Sanoat tarmoqlari va korxonalar hajmi hamda o‘zaro nisbatini","Bitta korxona ichidagi sexlar va bo‘limlarning boshqaruv tartibini","Davlat organlari o‘rtasida vakolatlarning taqsimlanish tartibini","Bank tizimidagi kreditlar va omonatlarning o‘zaro nisbatini"],["O‘zbekistonda tarmoqlarning rivojlanishi asosan nimalarga tayanadi?","Tabiiy resurslar, investitsiyalar, mehnat resurslari va texnologiyalarga","Chetdan keltiriladigan tayyor mahsulotlar va tashqi qarz mablag‘lariga","Davlat belgilagan rejalar va majburiy ishlab chiqarish topshiriqlariga","Mavsumiy ish haqi va aholining tasodifiy jamg‘armalaridan olinadigan mablag‘larga"],["Moddiy ishlab chiqarish sohasida nima yaratiladi?","Jismoniy shaklga ega bo‘lgan moddiy boyliklar va mahsulotlar","Nomoddiy ne’matlar shaklidagi xizmatlar va ularning qiymati","Moliyaviy bozordagi qimmatli qog‘ozlar va ularning kotirovkalari","Davlat boshqaruvi sohasidagi qarorlar va huquqiy hujjatlar to‘plami"],["Tarmoqlar iqtisodiyoti fanining asosiy vazifasi qaysi javobda to‘g‘ri ko‘rsatilgan?","Tarmoqlar rivojlanish yo‘llarini aniqlash va tahlil qilish","Xorijiy valyuta zaxiralarini ko‘paytirish choralarini ishlab chiqish","Aholi bandligini oshirish uchun yangi o‘quv dasturlarini tuzish","Markaziy bankning foiz stavkalarini belgilash tartibini ishlab chiqish"],["Iqtisodiyotda tarkibiy o‘zgarishlar (tarkibiy siljishlar) nimada ifodalanadi?","Tarmoqlar ulushi va o‘zaro nisbatining o‘zgarishida","Aholi soni va uning yosh tarkibining o‘zgarishida","Pul massasi hajmi va inflyatsiya darajasining o‘zgarishida","Davlat chegaralari va ma’muriy hududlar sonining o‘zgarishida"],["Milliy iqtisodiyot deganda nima tushuniladi?","Mamlakatdagi barcha tarmoqlar va sohalarning o‘zaro bog‘langan yagona tizimi","Bir hududda joylashgan sanoat korxonalarining ma’muriy birlashmasi va uning rahbariyati","Dunyo mamlakatlari o‘rtasida tuzilgan savdo shartnomalarining umumiy yig‘indisi","Byudjetdan moliyalashtiriladigan tashkilotlarning davlat tomonidan tasdiqlangan ro‘yxati"],["Bozor iqtisodiyoti sharoitida iqtisodiy faoliyatning asosiy sub’ektlari qaysilar?","Uy xo‘jaliklari, tadbirkorlik sub’ektlari (firmalar) va davlat","Xorijiy investorlar, xalqaro moliya institutlari va donorlar","Davlat korxonalari, ularning rahbariyati va nazorat organlari","Tijorat banklari, sug‘urta kompaniyalari va baholash tashkilotlari"],["Ishlab chiqarish-iqtisodiy faoliyat nimani anglatadi?","Moddiy boyliklar va xizmatlar yaratishga qaratilgan korxonalar faoliyatini","Davlat organlarining soliq tushumlarini hisobga olish bo‘yicha faoliyatini","Aholining dam olish va bo‘sh vaqtni o‘tkazish bo‘yicha faoliyatini","Sud organlarining iqtisodiy nizolarni ko‘rib chiqish bo‘yicha faoliyatini"],["Milliy iqtisodiyot rivojlanish darajasini ifodalovchi asosiy makroiqtisodiy ko‘rsatkich qaysi?","Yalpi ichki mahsulot (YaIM) hajmi","Korxonaning yillik sof foydasi","Aholining o‘rtacha yoshi darajasi","Bitta do‘konning savdo aylanmasi"],["Yalpi ichki mahsulot (YaIM) nimani ifodalaydi?","Mamlakatda bir yilda yaratilgan yakuniy tovar va xizmatlar qiymatini","Fuqarolarning xorijda olgan daromadlari va jamg‘armalari yig‘indisini","Byudjetning daromadlari va xarajatlari o‘rtasidagi farq miqdorini","Barcha korxonalarning oraliq iste’molga sarflagan xarajatlari yig‘indisini"],["Milliy iqtisodiyot strukturasi qaysi turlarga bo‘linadi?","Tarmoq, hududiy, mulkchilik va reproduktiv tuzilmalarga","Tabiiy, sun’iy va aralash tuzilmalarga ajratib o‘rganiladi","Yozgi, qishki va mavsumiy tuzilmalarga ajratib o‘rganiladi","Shahar, qishloq va chekka tuzilmalarga ajratib o‘rganiladi"],["Mulkchilik tuzilmasi iqtisodiyotda nimani ko‘rsatadi?","Davlat, xususiy va boshqa mulk shakllarining ulushini","Korxonalarning mamlakat hududlari bo‘yicha joylashuv darajasini","Tarmoqlarda band xodimlarning yosh va jins bo‘yicha tarkibini","Mahsulotlarning iste’mol va eksport bo‘yicha taqsimlanishini"],["Mehnat unumdorligi qanday aniqlanadi?","Mahsulot hajmini band xodimlar soniga nisbati orqali","Mahsulot hajmini asosiy fondlar boshlang‘ich qiymatiga nisbati orqali","Foyda miqdorini tovar zaxiralari qoldig‘iga nisbati orqali","Ish haqi fondini mahsulot tannarxiga nisbati orqali"],["Fond qaytimi ko‘rsatkichi nimani bildiradi?","Bir so‘mlik fondga to‘g‘ri keladigan mahsulot hajmini","Bir xodimga to‘g‘ri keladigan o‘rtacha ish haqi miqdorini","Bir so‘mlik mahsulotga sarflangan xomashyo qiymatini","Bir yil ichida to‘langan soliqlar yig‘indisining ulushini"],["Material sig‘imi ko‘rsatkichi nimani ifodalaydi?","Bir birlik mahsulotga sarflangan moddiy resurslar qiymatini","Bir xodimga to‘g‘ri keladigan asosiy fondlar qiymatini","Bir birlik mahsulotga to‘g‘ri keladigan ish vaqti miqdorini","Ishlab chiqarish quvvatlaridan foydalanish darajasini"],["Milliy iqtisodiyotning samaradorligi nimani ifodalaydi?","Natijaning erishish uchun sarflangan resurslarga nisbatini","Byudjet daromadlarining xarajatlardan ortiq bo‘lishini ko‘rsatadi","Ro‘yxatdan o‘tgan korxonalar sonining ko‘payishini ko‘rsatadi","Ishlab chiqarishda band bo‘lganlar sonining mutlaq ko‘payishini"],["Iqtisodiy o‘sish nimani anglatadi?","Tovar va xizmatlar hajmining vaqt davomida oshishini","Narxlar darajasi o‘zgarmay turib, aholi sonining oshishini","Milliy valyuta kursining doimiy belgilab qo‘yilishini","Boshqaruv organlari tuzilmasining kengayishi va murakkablashuvini"],["Milliy iqtisodiyotning raqobatbardoshligi nimada namoyon bo‘ladi?","Ichki va tashqi bozorlarda raqobatda sota olish qobiliyatida","Davlat chegaralari uzunligi va hududining kattaligida namoyon bo‘ladi","Dam olish kunlari va bayramlar sonining ko‘pligida namoyon bo‘ladi","Soliq turlarining ko‘pligi va murakkab tartibida namoyon bo‘ladi"],["Iqtisodiyotda «tarmoq» deganda nima tushuniladi?","Bir xil yoki o‘xshash mahsulot ishlab chiqaruvchi korxonalar yig‘indisi","Bir hududda joylashgan turli faoliyat sohalaridagi tashkilotlar yig‘indisi","Bitta mulkdorga qarashli barcha korxonalarning moliyaviy hisobotlari yig‘indisi","Davlat boshqaruv organlari va ularning quyi tuzilmalari majmui yig‘indisi"],["Tarmoqlararo kompleks nima?","Texnologik jihatdan bog‘liq bir necha tarmoqning birlashgan majmui","Bitta korxona ichidagi bir nechta sexlarning umumiy boshqaruv tizimi","Turli davlatlar o‘rtasidagi savdo aloqalarini tartibga soluvchi guruh","Xizmat ko‘rsatuvchi korxonalarning hududiy birlashmasi va uning kengashi"],["Infratuzilma tushunchasi nimani anglatadi?","Asosiy ishlab chiqarishga xizmat qiluvchi yordamchi tarmoqlarni","Asosiy mahsulotni yaratuvchi yetakchi tarmoqlarning umumiy majmuini","Xomashyo qazib oluvchi korxonalarning joylashuv xaritasi majmuini","Korxona xodimlarining malaka toifalari bo‘yicha ro‘yxatlari majmuini"],["Ishlab chiqarish infratuzilmasiga qaysi tarmoqlar kiradi?","Transport, aloqa, energetika ta’minoti va omborxona xo‘jaligi","Maktabgacha ta’lim, sog‘liqni saqlash va madaniyat muassasalari","Jamoat ovqatlanishi, mehmonxona va uy-joy kommunal xo‘jaligi","Sport majmualari, kutubxonalar va dam olish maskanlari tarmog‘i"],["Klaster nima?","Yaqin joylashgan o‘zaro bog‘liq korxonalar va tashkilotlar guruhi","Bir davlatning boshqa davlatga qo‘llaydigan savdo cheklovlari tizimi","Korxonaning moliyaviy natijalari to‘g‘risidagi yillik hisobot shakli","Bir tarmoq ichidagi xodimlarning kasaba uyushmasi tashkiloti"],["Tarmoqlararo klasterlarning asosiy afzalligi nimada?","Hamkorlik hisobiga xarajatlar kamayadi va unumdorlik oshadi","Korxonalar o‘rtasidagi raqobat yo‘qolib, narxlar davlat belgilaydi","Barcha korxonalar yagona davlat mulkiga o‘tib, mustaqilligini yo‘qotadi","Xorijiy investitsiyalar taqiqlanib, ichki resurslarga tayaniladi"],["Tarmoqlararo balans (xarajat-ishlab chiqarish) jadvali nimani ko‘rsatadi?","Tarmoqlar o‘rtasidagi mahsulot oqimi va bog‘liqlikni","Korxonalarning yil davomidagi foyda va zararlari hisobini","Davlat qarzining tuzilishi va uni to‘lash muddatlarini","Uy xo‘jaliklarining iste’mol xarajatlari tarkibini"],["Xarajat-ishlab chiqarish (tarmoqlararo balans) modelini yaratgan iqtisodchi kim?","Vasiliy Leontyev","Pol Samuelson","Milton Fridman","Jon Galbreyt"],["Milliy iqtisodiyotning tarkibiy siyosati nimaga qaratilgan?","Tarmoqlar nisbatini o‘zgartirib, tuzilmani yaxshilashga","Narxlarni davlat tomonidan to‘liq belgilab, bozorni bekor qilishga","Aholi sonini tartibga solib, migratsiyani to‘liq to‘xtatishga","Valyuta kursini doimiy o‘zgartirib, importni to‘liq cheklashga"],["Korxonalarni joylashtirishning asosiy omillaridan biri qaysi?","Xomashyo, energiya va mehnat resurslariga yaqinlik","Rahbarning shaxsiy xohishi va yashash joyining qulayligi","Korxona binosining tashqi ko‘rinishi va bezak rangi","Mintaqadagi bayram kunlarining soni va davomiyligi"],["Tarmoqni joylashtirishning asosiy tamoyillaridan biri qaysi?","Ishlab chiqarishni xomashyo va iste’molchiga yaqinlashtirish","Barcha korxonalarni faqat poytaxt atrofida to‘plash tamoyili","Ishlab chiqarishni iste’molchilardan uzoqlashtirish tamoyili","Hududlar o‘ziga xosligini hisobga olmasdan joylashtirish tamoyili"],["Ijtimoiy mehnat taqsimoti nimani anglatadi?","Mehnat turlarining ajralib, ixtisoslashib borishini","Xodimlar ish haqining davlat tomonidan teng taqsimlanishini","Ish vaqtining kunlar va haftalar bo‘yicha taqsimlanishini","Mehnat daromadlarining oila a’zolari o‘rtasida bo‘linishini"],["Ijtimoiy mehnat taqsimotining umumiy shakli nimani ifodalaydi?","Yirik tarmoqlarga (sanoat, qishloq xo‘jaligi) ajralishni","Korxona ichidagi ishchilar o‘rtasida vazifalar bo‘linishini","Ish vaqtini smenalarga bo‘lib tashkil etish tartibini","Ish vaqtini smenalarga bo‘lib tashkil etishni"],["Tarmoq tuzilmasi siyosatining mohiyati nimada?","O‘sishni ta’minlovchi ustuvor tarmoqlarni aniqlab, qo‘llab-quvvatlashda","Barcha tarmoqlarga bir xil soliq stavkasi joriy etib, soliqni qisqartirishda","Tarmoqlar faoliyatiga davlatning har qanday aralashuvini taqiqlashda","Xizmat sohasini rivojlantirib, sanoatni to‘xtatib qo‘yishda"],["Iqtisodiyot tarmoqlari o‘rtasidagi o‘zaro bog‘liqlik nimada namoyon bo‘ladi?","Bir tarmoq mahsulotining boshqasi uchun xomashyo bo‘lishida","Har bir tarmoqning boshqalardan mustaqil faoliyat yuritishida","Tarmoqlar o‘rtasida mahsulot almashinuvining taqiqlanishida","Tarmoqlarning bir xil mahsulot ishlab chiqarishga ixtisoslashuvida"],["Iqtisodiyot tarmoqlarining integratsiyasi nimani anglatadi?","Tarmoq va korxonalarning o‘zaro yaqinlashuvi va birlashuvini","Tarmoqlarning bir-biridan ajralib, alohida faoliyat yuritishini","Korxonalarning faoliyatini to‘xtatib, bozordan chiqib ketishini","Tarmoq mahsulotlari narxining davlat tomonidan o‘zgartirilishini"],["Vertikal integratsiya qanday ko‘rinishda amalga oshadi?","Ishlab chiqarish zanjiri bosqichlaridagi korxonalar birlashuvida","Bir xil mahsulot ishlab chiqaruvchi raqobatchilar birlashuvida","Bir-biriga bog‘liq bo‘lmagan turli soha korxonalari birlashuvida","Davlat va xususiy sektor o‘rtasidagi soliq munosabatlari birlashuvida"],["Gorizontal integratsiya qanday ko‘rinishda amalga oshadi?","Bir bosqichda faoliyat yurituvchi bir turdagi korxonalar birlashuvida","Xomashyodan tayyor mahsulotgacha bo‘lgan zanjir korxonalari birlashuvida","Turli davlatlardagi banklar o‘rtasida kredit shartnomalari tuzilishida","Korxona ichidagi sexlarning boshqaruv tizimi birlashtirilishida"],["Ishlab chiqarish konsentratsiyasi nima?","Ishlab chiqarish va xodimlarning yirik korxonalarda to‘planishi","Ishlab chiqarishning ko‘plab mayda korxonalar o‘rtasida tarqalish jarayoni","Ishlab chiqarilgan mahsulotlar assortimentining kengayish jarayoni","Korxonalarning yangi hududlarga ko‘chirilish jarayoni"],["Ishlab chiqarish diversifikatsiyasi nima?","Korxona mahsulot va xizmat turlarini ko‘paytirish, kengaytirish","Korxonaning bitta mahsulot turiga to‘liq ixtisoslashib qolishi","Ishlab chiqarish hajmini kamaytirib, xarajatlarni qisqartirish","Korxonaning boshqa korxonalarga to‘liq qo‘shilib ketishi va yo‘qolishi"],["Diversifikatsiyaning asosiy afzalligi nimada?","Bitta bozor tebranishidan keladigan xavfni kamaytirishda","Barcha resurslarni bitta yo‘nalishga jamlab, xavfni oshirishda","Raqobatchilarni yo‘q qilib, bozorda monopol narx belgilashda","Xodimlar sonini kamaytirib, ish haqini sezilarli oshirishda"],["Ishlab chiqarishning ixtisoslashuvi nimani anglatadi?","Korxona yoki tarmoqning bir turdagi mahsulotga yo‘naltirilishini","Korxonaning barcha turdagi mahsulotlarni bir vaqtda ishlab chiqarishini","Ishlab chiqarish jarayonining vaqtincha to‘liq to‘xtatib turilishini","Mahsulot sifatining ko‘rsatkichlarsiz, taxminan baholanishini"],["Ixtisoslashuvning qaysi turi tayyor mahsulot ishlab chiqarishga yo‘naltirilgan?","Predmet (buyum) bo‘yicha ixtisoslashuv","Detal (qism) bo‘yicha ixtisoslashuv","Texnologik bosqich bo‘yicha ixtisoslashuv","Hududiy (mintaqaviy) ixtisoslashuv"],["Ishlab chiqarish kooperatsiyasi nima?","Mahsulot yaratishda qatnashuvchi korxonalar o‘rtasidagi barqaror aloqalar","Korxonaning o‘z faoliyatini to‘liq xorijga ko‘chirish jarayoni va uning tartibi","Xodimlarning bitta korxonadan boshqasiga o‘tib ishlash tartibi va shartlari","Raqobatchilarning narxlarni bir xil darajada ushlab turishga oid kelishuvi"],["Kooperatsiyaning ixtisoslashuv bilan o‘zaro aloqasi qanday?","Ixtisoslashuv chuqurlashsa, kooperatsiya aloqalari kengayadi","Ixtisoslashuv kuchaygan sari kooperatsiya aloqalari yo‘qoladi","Ikkalasi bir-biriga bog‘liq emas va alohida da ham o‘zgarmaydigan xarajatlar","Ishlab chiqarish hajmi ortishi bilan to‘g‘ri mutanosib ortadigan xarajatlar","Korxona tashkil topgan paytda bir marta sarflanadigan xarajatlar","Faqat mahsulot sotilgan taqdirdagina yuzaga keladigan xarajatlar"],["O‘zgaruvchan xarajatlar nima?","Ishlab chiqarish hajmiga qarab o‘zgarib turadigan xarajatlar","Ishlab chiqarish hajmi o‘zgarganda ham o‘zgarmaydigan xarajatlar","Rahbariyatning ish haqi bilan bog‘liq doimiy xarajatlar","Bino ijarasi uchun muntazam to‘lanadigan xarajatlar"],["Quyidagilardan qaysi biri doimiy xarajatga misol bo‘ladi?","Ishlab chiqarish binosining ijara haqi","Mahsulotga sarflangan xomashyo qiymati","Ishbay ishchilarning mehnat haqi miqdori","Texnologik elektr energiyasi xarajati"],["To‘g‘ridan-to‘g‘ri (bevosita) xarajatlar nima?","Muayyan mahsulot tannarxiga aniq hisoblab qo‘shiladigan xarajatlar","Bir nechta mahsulotga birgalikda sarflanib, taqsimlab qo‘shiladigan xarajatlar","Korxonaning umumiy boshqaruv apparatini saqlash xarajatlari","Davlatga to‘lanadigan majburiy to‘lov va yig‘imlar xarajatlari"],["Foyda nima?","Daromaddan xarajatlar ayirilgandan keyin qolgan qism","Korxona ishlab chiqargan mahsulotning umumiy hajmi miqdori","Barcha xodimlarga to‘langan ish haqi yig‘indisi miqdori","Asosiy fondlarning qoldiq qiymati va uning miqdori"],["Foydani maksimallashtirish shartlaridan biri qaysi?","Xarajatlarni kamaytirib, sotish hajmini oshirish","Xarajatlarni oshirib, ishlab chiqarish hajmini qisqartirish","Sifatni pasaytirib, narxni belgilangan darajada saqlash","Sotish hajmini kamaytirib, zaxiralarni ko‘paytirish"],["Foyda qanday taqsimlanadi?","Soliqdan keyingi qismi rivojlanishga va rag‘batga ketadi","Barcha qismi davlat byudjetiga to‘liq o‘tkazib yuboriladi","Barcha qismi xodimlarga ish haqi sifatida teng taqsimlanadi","Taqsimlanmasdan, hech qanday maqsadda ishlatilmay saqlanadi"],["Rentabellik darajasi qanday ifodalanadi?","Foydaning xarajatga yoki kapitalga nisbati orqali","Xarajatlarning foydaga nisb adi, ularga xizmat qilmaydi","Faqat poytaxt tarmoqlariga xizmat ko‘rsatadi va viloyatlar bilan aloqani ta’minlamaydi","Faqat davlat idoralarining faoliyatini ta’minlaydi va tadbirkorlarga xizmat ko‘rsatmaydi"],["Aloqa xizmatlaridan tushgan daromad nimani ko‘rsatadi?","Aloqa korxonalarining xizmatdan olgan pul tushumlarini","Aloqa korxonalarining soliq to‘lagandan keyingi pul qoldig‘ini","Aloqa xodimlariga to‘langan ish haqining umumiy miqdorini","Aloqa uskunalarining umumiy qiymati va ularning eskirishini"],["Pochta aloqasi qaysi xizmatlarni ko‘rsatadi?","Xat-xabar, posilka va pul o‘tkazmalarini yetkazib berishni","Yuk tashish uchun temir yo‘l xizmatini ko‘rsatishni","Qurilish materiallari sotish xizmatini ko‘rsatishni","Sug‘urta polislari ishlab chiqarish xizmatini ko‘rsatishni"],["Savdo tarmog‘i nima?","Tovarlarni ishlab chiqaruvchidan iste’molchiga yetkazuvchi sotish tizimi","Xomashyoni qazib olib, qayta ishlovchi ishlab chiqarish tizimi va tarmog‘i","Yuklarni bir joydan ikkinchisiga ko‘chiruvchi transport tizimi va tarmog‘i","Axborotni uzoq masofaga uzatuvchi aloqa tizimi va uning tarmog‘i"],["Savdo tarmog‘ining asosiy xususiyati nimada?","Tovar aylanishini ta’minlab, ishlab chiqarish va iste’molni bog‘laydi","Yangi tovarlarni xomashyodan bevosita ishlab chiqaradi va sotadi","Faqat tashqi davlatlar bilan aloqa qilib, ichki bozorni e’tiborsiz qoldiradi","Faqat byudjetdan mablag‘ olib, mustaqil daromad topmaydi va faoliyat yuritadi"],["Savdo turlari qaysi javobda to‘g‘ri ko‘rsatilgan?","Ulgurji va chakana savdo turlari","Ishlab chiqarish va iste’mol savdosi turlari","Ichki va tashqi bank savdosi turlari","Mavsumiy va kunlik savdo turlari"],["Ulgurji savdo nima?","Tovarni yirik partiyada qayta sotish yoki ishlatish uchun sotish","Tovarlarni aholiga shaxsiy iste’mol uchun kichik miqdorda sotish tartibi","Xorijga tovar eksport qilish bo‘yicha tuziladigan bitimlar to‘plami","Davlat xaridlari doirasida tovar sotib olish bo‘yicha shartnomalar"],["Chakana savdo nima?","Tovarlarni aholiga shaxsiy iste’mol uchun kichik partiyalarda sotish","Tovarlarni korxonalarga yirik partiyalarda qayta sotish uchun sotish","Xomashyoni ishlab chiqaruvchilarga yetkazib berish va hisob-kitob qilish","Xorijiy valyutada hisob-kitob qilib, eksport bitimlarini rasmiylashtirish"],["Chakana tovar aylanmasi ko‘rsatkichi nimani ifodalaydi?","Aholiga sotilgan tovarlarning pul ifodasini","Ishlab chiqaruvchilarga sotilgan xomashyoning hajmini","Do‘konlarning umumiy maydoni va ularning sonini","Savdo xodimlarining ish haqi fondining miqdorini"],["Savdo ustamasi nima?","Sotish va sotib olish narxlari o‘rtasidagi farq","Tovarni ishlab chiqarishga sarflangan xomashyo qiymati miqdori","Savdo korxonasi xodimlariga to‘lanadigan mukofot miqdori","Davlatga to‘lanadigan soliq va boj to‘lovlari miqdori"],["Savdo korxonalari moliyaviy-xo‘jalik mexanizmining o‘ziga xosligi nimada?","Daromad asosan sotishdan olinadigan savdo ustamasi hisobidan shakllanadi","Daromad asosan byudjetdan ajratiladigan subsidiyalar hisobidan shakllanadi","Daromad asosan xorijiy grantlar va qarz mablag‘lari hisobidan shakllanadi","Daromad asosan ishlab chiqarilgan mahsulot hajmi hisobidan shakllanadi"],["Tovar zaxiralari savdo korxonasi uchun nimani anglatadi?","Sotish uchun saqlanayotgan tovarlarni (aylanma mablag‘lar tarkibida)","Asosiy fondlar tarkibidagi bino va inshootlarni va ularning qiymatini","Korxonaning bankdagi uzoq muddatli omonatlarini va ularning foizlarini","Xodimlarning ijtimoiy kafolat mablag‘larini va ularning zaxirasini"],["Elektron savdo (e-commerce) nima?","Tovar va xizmatlarni internet orqali sotish va sotib olish jarayoni","Tovarlarni an’anaviy bozorlarda naqd pulga sotish jarayoni va tartibi","Davlat idoralarida hujjatlarni rasmiylashtirish jarayoni va tartibi","Tovarlarni xorijga yuk mashinalarida tashish jarayoni va tartibi"],["Savdoning asosiy vazifalaridan biri qaysi?","Tovarni iste’molchiga yetkazib, ehtiyojini qondirish","Tovarlarni ishlab chiqarmasdan, faqat zaxiralarni to‘plash","Iste’molchilarga kerak bo‘lmagan tovarlarni majburan sotish","Ishlab chiqarish va iste’mol o‘rtasidagi aloqani to‘xtatish"],["Savdo rivojlanishini ifodalovchi ko‘rsatkichlarga qaysilar kiradi?","Tovar aylanmasi, savdo maydoni va aholining ta’minlanganligi","Sanoat mahsuloti hajmi, yer maydonlari va ishlab chiqarish quvvatlari miqdori","Aholining tug‘ilish va o‘lim darajasi hamda yosh tarkibi ko‘rsatkichlari","Transport vositalarining soni, yo‘l uzunligi va yuk tashish hajmi"],["Savdo shakllariga qaysi biri kiradi?","Do‘kon, bozor, savdo markazi va onlayn savdo","Zavod, fabrika, sex va ustaxona shakllari","Maktab, kollej, litsey va universitet shakllari","Kasalxona, poliklinika va dorixona shakllari"],["Jamoat ovqatlanishi (ommaviy ovqatlanish) nima?","Ovqat tayyorlash, sotish va iste’molini tashkil etuvchi xizmat tarmog‘i","Faqat qishloq xo‘jaligi xomashyosini yetishtiruvchi ishlab chiqarish tarmog‘i va uning tizimi","Faqat yuk va yo‘lovchilarni tashuvchi transport tarmog‘i va uning tizimi","Faqat qurilish materiallarini ishlab chiqaruvchi sanoat tarmog‘i va uning tizimi"],["Ommaviy ovqatlanishning asosiy maqsadi nima?","Aholining ovqatlanish ehtiyojini sifatli va qulay tarzda qondirish","Aholini ovqatlanishdan uzoqlashtirib, mahsulot zaxirasini to‘plash","Xomashyoni qayta ishlamasdan, to‘g‘ridan-to‘g‘ri eksport qilish","Byudjet xarajatlarini kamaytirish uchun soliqlarni oshirish"],["Ommaviy ovqatlanishning iqtisodiyotdagi roli nimada?","Aholi ehtiyojini qondirib, ish o‘rinlari yaratadi va qishloq xo‘jaligiga talabni oshiradi","Aholi ehtiyojini qondirmaydi va ish o‘rinlarini qisqartirib, talabni kamaytiradi","Faqat tashqi savdoga xizmat qilib, ichki bozorga hech qanday ta’sir ko‘rsatmaydi","Faqat davlat boshqaruvi organlarini ta’minlash bilan cheklanib, boshqalarga xizmat qilmaydi"],["Ommaviy ovqatlanish korxonalariga qaysilar kiradi?","Restoran, kafe, oshxona, bar va tez ovqatlanish shoxobchalari","Zavod, fabrika, sex va ustaxona kabi ishlab chiqarish korxonalari","Maktab, kollej, litsey va institut kabi ta’lim muassasalari","Kasalxona, poliklinika va sanatoriya kabi davolash muassasalari"],["Ommaviy ovqatlanish korxonalarining o‘ziga xos xususiyati nimada?","Ishlab chiqarish, sotish va iste’molni tashkil etishni bir vaqtda bajaradi","Faqat ishlab chiqarish funksiyasini bajaradi va sotish bilan shug‘ullanmaydi","Faqat sotish funksiyasini bajaradi va ovqat tayyorlash bilan shug‘ullanmaydi","Xizmat ko‘rsatmay, tayyor mahsulotni omborda saqlash bilan shug‘ullanadi"],["Ommaviy ovqatlanish mahsulotlarining qaysi xususiyati muhim hisoblanadi?","Tez buzilishi va qisqa muddatda iste’mol qilinishi","Uzoq yillar buzilmasdan omborlarda saqlanishi mumkinligi","Bir marta tayyorlanib, yil davomida iste’mol qilinishi","Faqat qadoqlangan holda sotilishi va tashilishi"],["Ommaviy ovqatlanishda mavsumiylik nimada namoyon bo‘ladi?","Yil fasllari va turistik oqimga qarab talabning o‘zgarishida","Talabning yil davomida deyarli o‘zgarmasdan, bir xil turishida","Faoliyatning yil davomida faqat bitta oyda yuritilishida","Tashqi savdo hajmining yil fasllariga qarab o‘zgarishida"],["Ommaviy ovqatlanish korxonasi samaradorligining ko‘rsatkichlariga qaysilar kiradi?","Tovar aylanmasi, daromad, rentabellik va o‘rindiqlar aylanishi","Aholi soni, tug‘ilish va o‘lim darajasi ko‘rsatkichlari","Yer maydoni, hosildorlik va yillik yog‘ingarchilik ko‘rsatkichlari","Transport tashish hajmi va aloqa abonentlari soni ko‘rsatkichlari"],["Ommaviy ovqatlanishda o‘rindiqlar aylanishi ko‘rsatkichi nimani ifodalaydi?","Bir o‘rindiqdan ma’lum davrda necha marta foydalanilganini","Zalda o‘rnatilgan o‘rindiqlarning umumiy sonini va ularning turlarini","O‘rindiqlar sotib olish uchun sarflangan mablag‘ miqdorini va uning manbasini","Xodimlarning bir kunlik ish vaqtini va dam olish kunlarini"],["Ommaviy ovqatlanish xarajatlari tarkibida qaysi element asosiy o‘rinni egallaydi?","Xomashyo va oziq-ovqat mahsulotlari xarajati","Reklama va ko‘ngilochar tadbirlar xarajati","Xorijiy sayohatlar va safarlar xarajati","Ilmiy-tadqiqot ishlari va tajribalar xarajati"],["Ommaviy ovqatlanishning turizm bilan qanday aloqasi bor?","Turistlarga ovqatlanish xizmatini ko‘rsatib, turizmni to‘ldiradi va rivojiga ko‘maklashadi","Turizm bilan hech qanday aloqasi yo‘q va mustaqil faoliyat yuritib, unga ta’sir qilmaydi","Faqat turistlar sonini kamaytirishga xizmat qiladi va turizmga to‘sqinlik qiladi","Faqat turistik yo‘nalishlardan tashqarida faoliyat yuritadi va turistlarga xizmat qilmaydi"],["Ommaviy ovqatlanishni rivojlantirish samaradorligi nimalarda ko‘rinadi?","Xizmat sifati, aholi qamrovi va rentabellikning oshishida","Xizmat sifatining pasayishi va narxlarning asossiz oshishida","Aholi qamrovining kamayishi va korxonalar sonining qisqarishida","Ish o‘rinlarining qisqarishi va rentabellikning pasayishida"],["Ommaviy ovqatlanishda xizmat sifatini oshirishning yo‘llaridan biri qaysi?","Malakani oshirish, assortimentni kengaytirish va sanitariya qoidalariga rioya","Xodimlar sonini kamaytirib, assortimentni qisqartirish va narxlarni oshirish","Sanitariya talablarini soddalashtirib, narxlarni oshirish va xarajatlarni kamaytirish","Xizmat madaniyatiga e’tiborni pasaytirib, ish vaqtini qisqartirish va daromadni oshirish"]];
const N=20,SEC=20*60;
const app=document.getElementById('app');
let T=[],ans=[],left=SEC,tm=null,done=false;
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function start(){
  clearInterval(tm);done=false;left=SEC;
  T=shuf(ALL).slice(0,N).map(q=>({q:q[0],o:shuf([{t:q[1],c:1},{t:q[2]},{t:q[3]},{t:q[4]}])}));
  ans=Array(N).fill(-1);render();window.scrollTo(0,0);
  tm=setInterval(()=>{left--;tick();if(left<=0)finish()},1000);
}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tick(){const e=document.getElementById('tm');if(e){e.textContent=fmt(left);e.className='timer'+(left<=120?' low':'')}}
function answered(){return ans.filter(x=>x>=0).length}
function updProg(){const p=document.getElementById('pg');if(p)p.textContent='Javob berildi: '+answered()+'/'+N;
  ans.forEach((x,i)=>{const a=document.getElementById('n'+i);if(a)a.className=x>=0?'d':''})}
function render(){
  let h='<div class="top"><div><div class="timer" id="tm">'+fmt(left)+'</div><div class="prog" id="pg"></div></div><div><button id="rs">Qayta boshlash</button> <button class="p" id="fn">Yakunlash</button></div></div>';
  h+='<div class="nav">'+T.map((_,i)=>'<a href="#q'+i+'" id="n'+i+'" onclick="document.getElementById(\'q'+i+'\').scrollIntoView({behavior:\'smooth\'});return false">'+(i+1)+'</a>').join('')+'</div>';
  T.forEach((t,i)=>{h+='<div class="q" id="q'+i+'"><h3>'+(i+1)+'. '+esc(t.q)+'</h3>'+t.o.map((o,j)=>'<div class="o" data-i="'+i+'" data-j="'+j+'"><b>'+'ABCD'[j]+')</b><span>'+esc(o.t)+'</span></div>').join('')+'</div>'});
  h+='<div class="row"><button class="p" id="fn2">Testni yakunlash</button></div>';
  app.innerHTML=h;
  app.querySelectorAll('.o').forEach(el=>el.onclick=()=>{if(done)return;const i=+el.dataset.i,j=+el.dataset.j;ans[i]=j;
    app.querySelectorAll('.o[data-i="'+i+'"]').forEach(x=>x.classList.toggle('sel',+x.dataset.j===j));updProg()});
  document.getElementById('rs').onclick=()=>{if(done||confirm('Qayta boshlansinmi? Yangi tasodifiy savollar chiqadi.'))start()};
  const f=()=>{const u=N-answered();if(!u||confirm(u+" ta savolga javob berilmagan. Yakunlaysizmi?"))finish()};
  document.getElementById('fn').onclick=f;document.getElementById('fn2').onclick=f;updProg();tick();
}
function finish(){
  if(done)return;done=true;clearInterval(tm);
  let sc=0;T.forEach((t,i)=>{if(ans[i]>=0&&t.o[ans[i]].c)sc++});
  const pct=Math.round(sc/N*100),used=SEC-Math.max(left,0);
  let h='<div class="r"><div class="big">'+sc+' / '+N+'</div><div>'+pct+'% to‘g‘ri · Sarflangan vaqt: '+fmt(used)+'</div><div class="row"><button class="p" id="rs2">Qayta boshlash</button></div></div>';
  T.forEach((t,i)=>{h+='<div class="q"><h3>'+(i+1)+'. '+esc(t.q)+'</h3>'+t.o.map((o,j)=>{let c='o';if(o.c)c+=' ok';else if(ans[i]===j)c+=' bad';return '<div class="'+c+'"><b>'+'ABCD'[j]+')</b><span>'+esc(o.t)+(o.c?' ✓':(ans[i]===j?' ✗':''))+'</span></div>'}).join('')+(ans[i]<0?'<div class="prog">Javob berilmagan</div>':'')+'</div>'});
  h+='<div class="row"><button class="p" id="rs3">Qayta boshlash</button></div>';
  app.innerHTML=h;document.getElementById('rs2').onclick=start;document.getElementById('rs3').onclick=start;window.scrollTo(0,0);
}
start();
</script></body></html>
